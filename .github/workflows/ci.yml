name: Extension checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run plugin:verify
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-extension-build
          path: |
            dist/
            plugin.json
            mcp.json
            skills/
            README.md
            THIRD_PARTY_NOTICES.md
            examples/
          retention-days: 14
